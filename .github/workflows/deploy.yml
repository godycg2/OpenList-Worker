name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 动态替换 D1 ID、KV ID 和 JWT 密钥
      - name: Inject Secrets into wrangler.jsonc
        run: |
          sed -i 's/D1_DATABASE_ID_PLACEHOLDER/${{ secrets.D1_DATABASE_ID }}/g' wrangler.jsonc
          sed -i 's/KV_ID_PLACEHOLDER/${{ secrets.KV_NAMESPACE_ID }}/g' wrangler.jsonc
          sed -i 's/JWT_SECRET_PLACEHOLDER/${{ secrets.JWT_SECRET }}/g' wrangler.jsonc

      # 执行编译与部署
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
